<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark light">

  {% seo %}
  {% feed_meta %}

  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <link rel="icon" type="image/png" sizes="32x32"   href="{{ '/assets/images/favicon/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16"   href="{{ '/assets/images/favicon/favicon-16x16.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="96x96"   href="{{ '/assets/images/favicon/favicon-96x96.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="128x128" href="{{ '/assets/images/favicon/favicon-128.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="196x196" href="{{ '/assets/images/favicon/favicon-196x196.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="152x152" href="{{ '/assets/images/favicon/apple-touch-icon-152x152.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="144x144" href="{{ '/assets/images/favicon/apple-touch-icon-144x144.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="120x120" href="{{ '/assets/images/favicon/apple-touch-icon-120x120.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="76x76"   href="{{ '/assets/images/favicon/apple-touch-icon-76x76.png' | relative_url }}">

  <script>
    (function () {
      try {
        var t = localStorage.getItem('aw-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
</head>
