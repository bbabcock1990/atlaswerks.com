# ─── Site identity ───────────────────────────────────────────────────────────
title: "Brandon Babcock — Atlas Werks"
brand: "Atlas Werks"
brand_full: "Atlas Werks LLC"
name: "Brandon Babcock"
role: "Cloud Architect & Founder, Atlas Werks LLC"
tagline: "Cloud architecture, infrastructure, and Microsoft licensing — built right, the first time."
description: >-
  Atlas Werks is the independent consulting practice of Brandon Babcock —
  a Cloud Architect and U.S. Marine veteran with 15+ years in IT. We design
  and ship Azure infrastructure, automate it with Terraform and Bicep, and
  resell Microsoft 365 and Azure licensing as a Microsoft CSP.

url: "https://www.atlaswerks.com"
baseurl: ""

# ─── Owner / contact ─────────────────────────────────────────────────────────
email: "brandon.babcock@atlaswerks.com"
location: "Bettendorf, IA · Working remotely across the U.S."
profile_image: "/assets/images/profile.jpg"

# Public social handles (rendered by _includes/social-icons.html)
social:
  github: "bbabcock1990"
  linkedin: "brandonbabcock1990"

# ─── Permalinks (preserve existing post URL for SEO) ─────────────────────────
permalink: /:title/

# ─── Build ───────────────────────────────────────────────────────────────────
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - .editorconfig
  - .github

# ─── SEO / feed defaults ─────────────────────────────────────────────────────
author:
  name: "Brandon Babcock"
  email: "brandon.babcock@atlaswerks.com"

twitter:
  card: summary_large_image

# ─── Page defaults ───────────────────────────────────────────────────────────
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Brandon Babcock"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
